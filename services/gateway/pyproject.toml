[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceapi-gateway"
version = "0.1.0"
description = "Agent-first voice API gateway: OpenAI-compatible audio endpoints, clone voices, jobs, MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "pydantic==2.12.5",
    "mcp==2.3.0",
    "sse-starlette==3.5.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "respx==0.23.1",
]

[project.scripts]
voiceapi-gateway = "voiceapi_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceapi_gateway = ["llms.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PL", "W", "UP", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "PLR0911", "PLR0912"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Test fakes stand in for GPU services; blocking file IO there is intentional.
"tests/**" = ["ASYNC240"]
