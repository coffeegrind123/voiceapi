name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: voiceapi-engine
            context: engine
            free_disk: true
          - image: voiceapi-worker
            context: services/audio-worker
            free_disk: true
          - image: voiceapi-gateway
            context: services/gateway
            free_disk: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Free runner disk (CUDA images are large)
        if: matrix.free_disk
        uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - name: Engine revision
        id: rev
        run: echo "sha=$(git -C ${{ matrix.context }} rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
